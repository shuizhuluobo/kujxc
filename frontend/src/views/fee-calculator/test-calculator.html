<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>费用计算器测试</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f7fa;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
    }
    .section {
      margin-bottom: 20px;
    }
    .section-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #303133;
    }
    .service-item {
      margin: 10px 0;
      padding: 10px;
      border: 1px solid #e4e7ed;
      border-radius: 4px;
      display: flex;
      align-items: center;
    }
    .service-item.disabled {
      opacity: 0.5;
      background: #f5f7fa;
    }
    .service-item input[type="checkbox"] {
      margin-right: 10px;
    }
    .service-item label {
      flex: 1;
    }
    .price-note {
      font-size: 12px;
      color: #909399;
    }
    .result {
      margin-top: 20px;
      padding: 10px;
      background: #ecf5ff;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>费用计算器测试</h1>
    
    <div class="section">
      <div class="section-title">计算机服务</div>
      
      <div class="service-item" data-service="出库送货">
        <input type="checkbox" data-item="出库送货">
        <label>出库送货 <span class="price-note">20元/台 ≤5台100元/次</span></label>
      </div>
      
      <div class="service-item" data-service="出库到就位">
        <input type="checkbox" data-item="出库到就位">
        <label>出库到就位 (含送货+安装) <span class="price-note">40元/台 ≤5台150元/次</span></label>
      </div>
      
      <div class="service-item" data-service="安装就位">
        <input type="checkbox" data-item="安装就位">
        <label>安装就位 <span class="price-note">20元/台</span></label>
      </div>
      
      <div class="service-item" data-service="回收到入库">
        <input type="checkbox" data-item="回收到入库">
        <label>回收到入库 (含回收+脱密) <span class="price-note">170元/台</span></label>
      </div>
      
      <div class="service-item" data-service="回收转运">
        <input type="checkbox" data-item="回收转运">
        <label>回收转运 <span class="price-note">20元/台 ≤5台100元/次</span></label>
      </div>
      
      <div class="service-item" data-service="全流程服务">
        <input type="checkbox" data-item="全流程服务">
        <label>全流程服务 (含所有服务) <span class="price-note">200元/台</span></label>
      </div>
      
      <div class="service-item" data-service="脱密入库">
        <input type="checkbox" data-item="脱密入库">
        <label>脱密入库 <span class="price-note">150元/台</span></label>
      </div>
    </div>
    
    <div class="result">
      <h3>测试结果</h3>
      <div id="test-result"></div>
    </div>
  </div>
  
  <script>
    // 单项服务与组合服务的包含关系
    const serviceInclusionMap = {
      '出库到就位': ['出库送货', '安装就位'],
      '回收到入库': ['回收转运', '脱密入库'],
      '全流程服务': ['出库送货', '安装就位', '回收转运', '脱密入库'],
    };
    
    // 模拟计算机服务数据
    const computerServices = [
      { item: '出库送货', selected: false, disabled: false },
      { item: '出库到就位', selected: false, disabled: false },
      { item: '安装就位', selected: false, disabled: false },
      { item: '回收到入库', selected: false, disabled: false },
      { item: '回收转运', selected: false, disabled: false },
      { item: '全流程服务', selected: false, disabled: false },
      { item: '脱密入库', selected: false, disabled: false },
    ];
    
    // 更新服务的禁用状态
    function updateServiceDisabledState() {
      const selectedCombo = computerServices.find(s => s.selected && ['出库到就位', '回收到入库', '全流程服务'].includes(s.item));
      const selectedSingleItems = computerServices.filter(s => s.selected && !['出库到就位', '回收到入库', '全流程服务'].includes(s.item)).map(s => s.item);
      
      // 重置所有服务的禁用状态
      computerServices.forEach(s => {
        s.disabled = false;
      });
      
      if (selectedCombo) {
        // 如果有选中的组合服务，禁用所有被包含的单项服务
        const includedItems = serviceInclusionMap[selectedCombo.item] || [];
        computerServices.forEach(s => {
          if (includedItems.includes(s.item)) {
            s.disabled = true;
          } else if (['出库到就位', '回收到入库', '全流程服务'].includes(s.item) && s.item !== selectedCombo.item) {
            // 禁用其他组合服务
            s.disabled = true;
          }
        });
      } else if (selectedSingleItems.length > 0) {
        // 如果有选中的单项服务，禁用包含这些单项的组合服务
        computerServices.forEach(s => {
          if (['出库到就位', '回收到入库', '全流程服务'].includes(s.item)) {
            const includedItems = serviceInclusionMap[s.item] || [];
            // 如果选中的单项服务在该组合服务内，则禁用该组合服务
            const hasConflict = selectedSingleItems.some(single => includedItems.includes(single));
            s.disabled = hasConflict;
          }
        });
      }
      
      // 更新UI
      updateUI();
    }
    
    // 更新UI
    function updateUI() {
      computerServices.forEach(service => {
        const element = document.querySelector(`[data-service="${service.item}"]`);
        const checkbox = element.querySelector(`input[type="checkbox"]`);
        
        if (service.disabled) {
          element.classList.add('disabled');
          checkbox.disabled = true;
        } else {
          element.classList.remove('disabled');
          checkbox.disabled = false;
        }
        
        checkbox.checked = service.selected;
      });
      
      // 更新测试结果
      updateTestResult();
    }
    
    // 更新测试结果
    function updateTestResult() {
      const resultElement = document.getElementById('test-result');
      let resultHTML = '<h4>当前状态：</h4>';
      
      computerServices.forEach(service => {
        resultHTML += `<p>${service.item}: 选中=${service.selected}, 禁用=${service.disabled}</p>`;
      });
      
      resultElement.innerHTML = resultHTML;
    }
    
    // 绑定事件
    document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
      checkbox.addEventListener('change', function() {
        const itemName = this.dataset.item;
        const service = computerServices.find(s => s.item === itemName);
        if (service) {
          service.selected = this.checked;
          updateServiceDisabledState();
        }
      });
    });
    
    // 初始化
    updateUI();
  </script>
</body>
</html>
